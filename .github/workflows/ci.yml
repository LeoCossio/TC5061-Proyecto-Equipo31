name: CI de MiBici

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-compose:
    name: Pytest y arranque con Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mibici-ci

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Configurar uv y su caché
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --python 3.13

      - name: Ejecutar Pytest
        run: uv run --locked --python 3.13 python -m pytest tests -q

      - name: Construir la imagen y arrancar los servicios
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          docker compose ps -a

      - name: Comprobar inferencia en P1, P2 y P3
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          campos = {
              "p1": "demanda_predicha",
              "p2": "clase_predicha",
              "p3": "cluster",
          }

          for modelo, campo in campos.items():
              cuerpo = Path(f"references/ejemplos_api/{modelo}.json").read_bytes()
              peticion = Request(
                  f"http://127.0.0.1:8000/predict/{modelo}",
                  data=cuerpo,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urlopen(peticion, timeout=120) as respuesta:
                  datos = json.load(respuesta)
                  if respuesta.status != 200 or type(datos.get(campo)) not in (int, float):
                      raise RuntimeError(f"{modelo}: respuesta inesperada: {datos}")
                  print(f"{modelo}: HTTP {respuesta.status} {datos}")
          PY

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color

      - name: Limpiar el entorno de CI
        if: always()
        run: docker compose down --volumes