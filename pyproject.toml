[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "An\u00e1lisis y modelado de patrones de uso del sistema MiBici"
authors = [
  { name = "Equipo 31 MLOps" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "evidently==0.7.23",
    "fastapi>=0.162.0",
    "loguru==0.7.3",
    "matplotlib==3.10.6",
    "mlflow==3.17.2",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.2",
    "scikit-learn==1.7.2",
    "tqdm==4.67.3",
    "uvicorn>=0.54.0",
]


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "deepchecks==0.19.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

